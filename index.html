:!1,explain:"Elle recommande par exemple la cigu\xEB en compresse externe contre les douleurs cons\xE9cutives \xE0 un coup, tout en d\xE9conseillant fermement son usage interne."},{id:"pl93",type:"qcm",q:'Certains chapitres du "livre des plantes" de la Physica ne traitent en r\xE9alit\xE9 pas de plantes, mais de\u2026',options:["Miel, sucre, lait, beurre, sel, \u0153ufs...","Min\xE9raux et pierres pr\xE9cieuses","Instruments de cuisine","Animaux de la ferme"],correct:0,explain:'Une dizaine de chapitres "intrus" traitent de ce type de sujets, ce qui complique le d\xE9compte r\xE9el des plantes d\xE9crites.'}]},{id:"quiz-neuro",name:"Neurosciences",emoji:"\u{1F9E0}",questions:[{id:"nr1",type:"qcm",q:"Combien de neurones compte environ le cerveau humain adulte ?",options:["86 milliards","1 milliard","500 millions","1000 milliards"],correct:0,explain:"Un chiffre souvent cit\xE9, bien loin des id\xE9es re\xE7ues plus modestes."},{id:"nr2",type:"vf",q:"Nous n'utilisons que 10% de notre cerveau.",correct:!1,explain:"Neuromythe : l'imagerie c\xE9r\xE9brale montre une activit\xE9 r\xE9partie dans tout le cerveau."},{id:"nr3",type:"qcm",q:"Quelle structure est principalement associ\xE9e \xE0 la m\xE9moire ?",options:["Hippocampe","Cervelet","Bulbe rachidien","Thalamus"],correct:0,explain:"L'hippocampe est central pour former de nouveaux souvenirs."},{id:"nr4",type:"vf",q:"Le cerveau humain p\xE8se environ 1,3 \xE0 1,4 kg en moyenne.",correct:!0,explain:"Un poids qui varie peu d'un adulte \xE0 l'autre."},{id:"nr5",type:"qcm",q:"Quel neurotransmetteur est souvent associ\xE9 au plaisir et \xE0 la r\xE9compense ?",options:["Dopamine","S\xE9rotonine","GABA","Ac\xE9tylcholine"],correct:0,explain:"La dopamine est le neurotransmetteur cl\xE9 du circuit de la r\xE9compense."},{id:"nr6",type:"vf",q:"Les neurones peuvent se r\xE9g\xE9n\xE9rer dans certaines r\xE9gions du cerveau (neurogen\xE8se).",correct:!0,explain:"La neurogen\xE8se adulte existe notamment dans l'hippocampe."},{id:"nr7",type:"qcm",q:"Quel est le r\xF4le principal du cervelet ?",options:["Coordination des mouvements","Vision","Langage","Digestion"],correct:0,explain:"Le cervelet ajuste pr\xE9cision et \xE9quilibre des mouvements."},{id:"nr8",type:"vf",q:"Le sommeil ne sert \xE0 rien pour la m\xE9morisation.",correct:!1,explain:"Le sommeil, surtout profond et paradoxal, consolide la m\xE9moire."},{id:"nr9",type:"qcm",q:"Comment s'appelle la gaine qui acc\xE9l\xE8re la transmission le long des axones ?",options:["My\xE9line","Synapse","Dendrite","Axone"],correct:0,explain:"La my\xE9line isole l'axone et acc\xE9l\xE8re la conduction nerveuse."},{id:"nr10",type:"vf",q:"Le stress chronique peut r\xE9duire le volume de l'hippocampe.",correct:!0,explain:"Un exc\xE8s prolong\xE9 de cortisol peut ab\xEEmer les neurones de l'hippocampe."},{id:"nr13",type:"qcm",q:"Quelle structure joue un r\xF4le cl\xE9 dans la gestion de la peur et des \xE9motions ?",options:["Amygdale","Hippocampe","Cortex visuel","Thalamus"],correct:0,explain:"L'amygdale d\xE9tecte la menace et d\xE9clenche la peur."},{id:"nr14",type:"vf",q:"Le cerveau consomme environ 20% de l'\xE9nergie totale du corps au repos.",correct:!0,explain:"Un organe gourmand en \xE9nergie malgr\xE9 sa petite taille."},{id:"nr16",type:"vf",q:"L'exercice physique r\xE9gulier favorise la naissance de nouveaux neurones dans l'hippocampe.",correct:!0,explain:"L'exercice stimule le facteur BDNF, favorable aux nouveaux neurones."},{id:"nr17",type:"qcm",q:"Quel est le nom de la jonction entre deux neurones o\xF9 se transmet l'information ?",options:["Synapse","Ganglion","N\u0153ud de Ranvier","Cortex"],correct:0,explain:"C'est \xE0 la synapse que l'information passe d'un neurone \xE0 l'autre."},{id:"nr18",type:"vf",q:"Les deux h\xE9misph\xE8res du cerveau sont totalement ind\xE9pendants et ne communiquent jamais.",correct:!1,explain:"Le corps calleux relie et fait communiquer les deux h\xE9misph\xE8res."},{id:"bias1",type:"qcm",q:'Le "biais de confir

s locales."},{id:"pl54",type:"qcm",q:"La cardamome, \xE9pice tr\xE8s utilis\xE9e dans le chai indien, est traditionnellement reconnue pour faciliter\u2026",options:["La digestion","La cicatrisation des plaies","La circulation sanguine","Aucun usage traditionnel connu"],correct:0,explain:"Elle accompagne souvent les repas riches pour aider \xE0 dig\xE9rer."},{id:"pl55",type:"qcm",q:"Le safran, \xE9pice la plus ch\xE8re au monde, provient de\u2026",options:["Les stigmates s\xE9ch\xE9s de la fleur de crocus","Les racines d'un arbuste tropical","Les graines d'un poivrier","Les p\xE9tales de rose"],correct:0,explain:"Chaque fleur ne donne que 3 fins stigmates, d'o\xF9 son prix \xE9lev\xE9."},{id:"pl56",type:"vf",q:"Il faut environ 150 fleurs de crocus pour obtenir seulement 1 gramme de safran.",correct:!0,explain:"Une r\xE9colte enti\xE8rement manuelle qui explique la raret\xE9 de l'\xE9pice."},{id:"pl59",type:"vf",q:'Le moringa, surnomm\xE9 "arbre miracle", a des feuilles particuli\xE8rement riches en vitamines et min\xE9raux.',correct:!0,explain:"Il est parfois utilis\xE9 pour lutter contre la malnutrition dans certaines r\xE9gions."},{id:"pl60",type:"qcm",q:"Le gel d'aloe vera est traditionnellement appliqu\xE9 en usage externe pour\u2026",options:["Apaiser les coups de soleil l\xE9gers","Stimuler l'app\xE9tit","Faire baisser la fi\xE8vre","Aucun usage traditionnel connu"],correct:0,explain:"Son effet rafra\xEEchissant et apaisant sur la peau est largement reconnu."},{id:"pl62",type:"qcm",q:"Le calendula (souci officinal) est traditionnellement utilis\xE9 en usage externe pour\u2026",options:["Apaiser et aider \xE0 cicatriser la peau","Stimuler la digestion","Calmer la toux","Aucun usage traditionnel connu"],correct:0,explain:"On le retrouve souvent dans les cr\xE8mes et baumes pour peaux sensibles."},{id:"pl67",type:"qcm",q:"La racine de val\xE9riane est traditionnellement utilis\xE9e en tisane du soir pour favoriser\u2026",options:["L'endormissement","La concentration","La digestion des graisses","Aucun usage traditionnel connu"],correct:0,explain:"Une des plantes les plus classiques pour accompagner le coucher."},{id:"pl68",type:"vf",q:"La r\xE9glisse, en consommation excessive et prolong\xE9e, est d\xE9conseill\xE9e en cas d'hypertension.",correct:!0,explain:"Elle peut favoriser la r\xE9tention d'eau et l'\xE9l\xE9vation de la tension art\xE9rielle."},{id:"pl69",type:"qcm",q:"Les graines de fenugrec sont traditionnellement utilis\xE9es pour\u2026",options:["Stimuler l'app\xE9tit","Calmer la toux","R\xE9duire la fi\xE8vre","Aucun usage traditionnel connu"],correct:0,explain:"Elles sont \xE9galement utilis\xE9es en cuisine, notamment indienne."},{id:"pl70",type:"vf",q:`L'estragon fait partie des "fines herbes" traditionnelles de la cuisine fran\xE7aise, aux c\xF4t\xE9s du persil, du cerfeuil et de la ciboulette.`,correct:!0,explain:"Il est notamment associ\xE9 au poulet et aux sauces au vinaigre."},{id:"pl71",type:"qcm",q:"En cuisine, la feuille de laurier se retire g\xE9n\xE9ralement\u2026",options:["Avant de servir le plat","Elle se mange toujours crue","Elle se consomme en dessert","Elle ne s'utilise jamais en cuisine"],correct:0,explain:"Elle parfume la cuisson mais n'est pas cens\xE9e \xEAtre mang\xE9e telle quelle."},{id:"pl72",type:"qcm",q:"La badiane (anis \xE9toil\xE9) est traditionnellement utilis\xE9e en infusion pour faciliter\u2026",options:["La digestion","La cicatrisation","La vision nocturne","Aucun usage traditionnel connu"],correct:0,explain:"Elle parfume aussi certaines liqueurs et plats mijot\xE9s."},{id:"pl73",type:"vf",q:"Il existe une badiane du Japon toxique, \xE0 ne pas confondre avec la badiane de Chine utilis\xE9e en cuisine et en tisane.",correct:!0,explain:"Des cas d'intoxication ont \xE9t\xE9 rapport\xE9s en cas de confusion entre les deux."},{id:"pl74",type:"qcm",q:"L'origan doit une grande partie de son action antibact\xE9rienne \xE0\u2026",options:["Le carvacrol","La curcumine","L'eug\xE9nol","La thuyone"],correct:0,explain:"Un compos\xE9 aromatique aussi pr\xE9sent dans la marjolaine."},{id:"pl75",type:"qcm",q:"Le cumin est traditionnellement utilis\xE9, en cuisine comme en tisane, pour faciliter\u2026",options:["La digestion","L'endormissement","La circulation sanguine","Aucun usage traditionnel connu"],correct:0,explain:"Une \xE9pice courante dans de nombreuses cuisines du monde."},{id:"pl77",type:"qcm",q:"En phytoth\xE9rapie, la camomille allemande (matricaire) est traditionnellement plut\xF4t associ\xE9e \xE0\u2026",options:["Un usage digestif et anti-inflammatoire","Un usage exclusivement cosm\xE9tique","Un usage anesth\xE9siant fort","Aucun usage traditionnel connu"],correct:0,explain:"La camomille romaine est, elle, plut\xF4t r\xE9put\xE9e pour son effet calmant nerveux."},{id:"pl78",type:"vf",q:"La ciboulette perd une grande partie de sa saveur si on la fait cuire longtemps : elle s'ajoute donc en fin de cuisson.",correct:!0,explain:"C'est pourquoi on la ciselle fra\xEEche, juste avant de servir."},{id:"pl79",type:"qcm",q:'Le cerfeuil, une des "fines herbes" fran\xE7aises, est traditionnellement associ\xE9 \xE0 un go\xFBt\u2026',options:["L\xE9g\xE8rement anis\xE9","Tr\xE8s piquant","Amer et poivr\xE9","Sucr\xE9 comme la r\xE9glisse"],correct:0,explain:"Un parfum d\xE9licat, plus discret que le persil ou l'estragon."},{id:"pl80",type:"qcm",q:"Le paprika, \xE9pice obtenue \xE0 partir de piments s\xE9ch\xE9s et moulus, est traditionnellement associ\xE9 \xE0 la cuisine\u2026",options:["Hongroise et espagnole","Japonaise","Scandinave","Aucune cuisine en particulier"],correct:0,explain:"Il peut \xEAtre doux ou fum\xE9 selon la vari\xE9t\xE9 de piment et le s\xE9chage."},{id:"pl81",type:"qcm",q:"La badiane, le clou de girofle et la cannelle sont des \xE9pices que l'on retrouve fr\xE9quemment ensemble dans\u2026",options:["Le pain d'\xE9pices et les vins chauds d'hiver","Les salades d'\xE9t\xE9","Les sorbets aux fruits rouges","Aucun usage culinaire courant"],correct:0,explain:`Ce trio d'\xE9pices "chaudes" est classique des recettes hivernales.`},{id:"pl82",type:"vf",q:"Le persil contient, \xE0 poids \xE9gal, davantage de vitamine C que certains agrumes.",correct:!0,explain:"Il reste toutefois consomm\xE9 en petite quantit\xE9, ce qui limite son apport r\xE9el."},{id:"pl84",type:"qcm",q:`D'apr\xE8s les recherches historiques les plus r\xE9centes, le chapitre de la Physica consacr\xE9 aux champignons ("De Fungis")\u2026`,options:["Aurait probablement \xE9t\xE9 ajout\xE9 apr\xE8s la mort de Hildegarde, par un copiste","Figure \xE0 l'identique dans absolument tous les manuscrits connus","Aurait \xE9t\xE9 \xE9crit en tout premier, avant tous les autres chapitres","Ne parlerait pas r\xE9ellement de champignons malgr\xE9 son titre"],correct:0,explain:"Plusieurs indices (num\xE9rotation, changement de main, absence dans l'\xE9dition imprim\xE9e de 1533) sugg\xE8rent un ajout tardif."},{id:"pl85",type:"vf",q:"Selon l'\xE9tat actuel de la recherche historique, le chapitre sur les champignons de la Physica aurait \xE9t\xE9 \xE9crit par Hildegarde elle-m\xEAme, sans le moindre doute possible.",correct:!1,explain:"Plusieurs indices sugg\xE8rent au contraire qu'il s'agirait d'un ajout tardif, par un copiste post\xE9rieur \xE0 sa mort."},{id:"pl86",type:"qcm",q:"Selon Hildegarde, pour conserver ses vertus, l'ail doit \xEAtre consomm\xE9\u2026",options:["Cru, sous peine de perdre ses propri\xE9t\xE9s","Toujours cuit longuement","Uniquement s\xE9ch\xE9 puis moulu","Jamais seul, toujours m\xE9lang\xE9 \xE0 du miel"],correct:0,explain:`Elle pr\xE9cise qu'autrement, il perd ses propri\xE9t\xE9s "comme un vin \xE9vent\xE9".`},{id:"pl87",type:"qcm",q:"Dans le pavot, quelle partie de la plante Hildegarde jugeait-elle responsable de l'effet calmant favorisant le sommeil ?",options:["La graine","La racine","La tige","La fleur enti\xE8re"],correct:0,explain:"Une observation assez fine pour l'\xE9poque, puisque c'est effectivement la graine qui est concern\xE9e."},{id:"pl88",type:"vf",q:"D'apr\xE8s Hildegarde, appliquer de la vuln\xE9raire ou de la consoude sur une plaie caus\xE9e par le fer gu\xE9rit toujours la blessure en profondeur, sans aucun risque.",correct:!1,explain:"Elle met justement en garde : ces plantes referment vite la peau en surface, ce qui peut repousser le mal \xE0 l'int\xE9rieur si celui-ci n'a pas \xE9t\xE9 trait\xE9 au pr\xE9alable."},{id:"pl89",type:"qcm",q:"Plusieurs \xE9pices aujourd'hui per\xE7ues comme exotiques (galanga, cannelle, girofle...) que mentionne Hildegarde \xE9taient en r\xE9alit\xE9\u2026",options:["D\xE9j\xE0 disponibles sur certains march\xE9s d'Europe occidentale d\xE8s le haut Moyen \xC2ge","Totalement inconnues en Europe avant elle","R\xE9serv\xE9es exclusivement \xE0 la cour imp\xE9riale","Cultiv\xE9es localement dans le jardin de son monast\xE8re"],correct:0,explain:"Des sources d\xE8s le IXe si\xE8cle attestent leur pr\xE9sence sur des march\xE9s comme celui de Cambrai."},{id:"pl90",type:"vf",q:"Le plan du monast\xE8re de Saint-Gall (vers 820) distinguait d\xE9j\xE0 un jardin potager (l'hortus) et un jardin de plantes m\xE9dicinales (l'herbularius), s\xE9par\xE9s l'un de l'autre.",correct:!0,explain:"Un mod\xE8le de jardin monastique apparemment encore d'actualit\xE9 trois si\xE8cles plus tard, \xE0 l'\xE9poque de Hildegarde."},{id:"pl91",type:"qcm",q:"D\xE8s le d\xE9but du XXe si\xE8cle, certains commentateurs ont surnomm\xE9 Hildegarde de Bingen\u2026",options:['La "premi\xE8re naturaliste" (et "femme-m\xE9decin") allemande','La "reine des alchimistes"',`L'"inventrice de la pharmacie" moderne`,'La "m\xE8re de la botanique" universelle'],correct:0,explain:"Un titre honorifique donn\xE9 d\xE8s 1927, bien avant la vague actuelle de red\xE9couverte enthousiaste."},{id:"pl92",type:"vf",q:"Toutes les plantes toxiques mentionn\xE9es par Hildegarde (cigu\xEB, belladone, jusquiame...) sont, selon elle, \xE0 proscrire dans n'importe quelle pr\xE9paration, m\xEAme en usage externe.",correct:!1,explain:"Elle recommande par exemple la cigu\xEB en compresse externe contre les douleurs cons\xE9cutives \xE0 un coup, tout en d\xE9conseillant fermement son usage interne."},{id:"pl93",type:"qcm",q:'Certains chapitres du "livre des plantes" de la Physica ne traitent en r\xE9alit\xE9 pas de plantes, mais de\u2026',options:["Miel, sucre, lait, beurre, sel, \u0153ufs...","Min\xE9raux et pierres pr\xE9cieuses","Instruments de cuisine","Animaux de la ferme"],correct:0,explain:'Une dizaine de chapitres "intrus" traitent de ce type de sujets, ce qui complique le d\xE9compte r\xE9el des plantes d\xE9crites.'}]},{id:"quiz-neuro",name:"Neurosciences",emoji:"\u{1F9E0}",questions:[{id:"nr1",type:"qcm",q:"Combien de neurones compte environ le cerveau humain adulte ?",options:["86 milliards","1 milliard","500 millions","1000 milliards"],correct:0,explain:"Un chiffre souvent cit\xE9, bien loin des id\xE9es re\xE7ues plus modestes."},{id:"nr2",type:"vf",q:"Nous n'utilisons que 10% de notre cerveau.",correct:!1,explain:"Neuromythe : l'imagerie c\xE9r\xE9brale montre une activit\xE9 r\xE9partie dans tout le cerveau."},{id:"nr3",type:"qcm",q:"Quelle structure est principalement associ\xE9e \xE0 la m\xE9moire ?",options:["Hippocampe","Cervelet","Bulbe rachidien","Thalamus"],correct:0,explain:"L'hippocampe est central pour former de nouveaux souvenirs."},{id:"nr4",type:"vf",q:"Le cerveau humain p\xE8se environ 1,3 \xE0 1,4 kg en moyenne.",correct:!0,explain:"Un poids qui varie peu d'un adulte \xE0 l'autre."},{id:"nr5",type:"qcm",q:"Quel neurotransmetteur est souvent associ\xE9 au plaisir et \xE0 la r\xE9compense ?",options:["Dopamine","S\xE9rotonine","GABA","Ac\xE9tylcholine"],correct:0,explain:"La dopamine est le neurotransmetteur cl\xE9 du circuit de la r\xE9compense."},{id:"nr6",type:"vf",q:"Les neurones peuvent se r\xE9g\xE9n\xE9rer dans certaines r\xE9gions du cerveau (neurogen\xE8se).",correct:!0,explain:"La neurogen\xE8se adulte existe notamme 6`,options:["Une absorption totale dans une activit\xE9, avec perte de la notion du temps","Un \xE9tat de somnolence profonde","Une distraction constante","Un \xE9tat d'ennui prolong\xE9"],correct:0,explain:"Un concept popularis\xE9 par le psychologue Mihaly Csikszentmihalyi."},{id:"neu30",type:"vf",q:"Le cortex pr\xE9frontal continuerait de se d\xE9velopper jusqu'\xE0 environ 25 ans.",correct:!0,explain:"Cela expliquerait en partie une prise de risque plus marqu\xE9e \xE0 l'adolescence."},{id:"neu31",type:"qcm",q:"Chez la plupart des droitiers, le langage est trait\xE9 de fa\xE7on pr\xE9dominante par\u2026",options:["L'h\xE9misph\xE8re gauche","L'h\xE9misph\xE8re droit","Les deux h\xE9misph\xE8res de fa\xE7on parfaitement \xE9gale","Aucun des deux, uniquement le cervelet"],correct:0,explain:'Une vraie asym\xE9trie fonctionnelle, \xE0 ne pas confondre avec le mythe "cerveau cr\xE9atif / rationnel".'},{id:"neu32",type:"qcm",q:"Selon la loi de Yerkes-Dodson, la performance serait g\xE9n\xE9ralement meilleure\u2026",options:["\xC0 un niveau de stress mod\xE9r\xE9","Avec un stress toujours le plus faible possible","Avec un stress toujours le plus \xE9lev\xE9 possible","Ind\xE9pendamment du niveau de stress"],correct:0,explain:"Trop peu de pression endort la motivation, trop de pression la sature."},{id:"neu33",type:"vf",q:"Pratiquer r\xE9guli\xE8rement la gratitude serait associ\xE9 \xE0 des effets positifs mesur\xE9s sur le bien-\xEAtre.",correct:!0,explain:"Plusieurs \xE9tudes en psychologie positive vont dans ce sens."},{id:"neu34",type:"qcm",q:'Le "syst\xE8me nerveux autonome" se divise en deux branches compl\xE9mentaires : le sympathique et\u2026',options:["Le parasympathique","Le somatique","Le p\xE9riph\xE9rique","Le central"],correct:0,explain:"Le sympathique mobilise (alerte), le parasympathique apaise (repos et digestion)."},{id:"neu35",type:"vf",q:'Le nombre de connexions synaptiques serait \xE0 son maximum durant la petite enfance, avant un "\xE9lagage" progressif des moins utilis\xE9es.',correct:!0,explain:"Ce ph\xE9nom\xE8ne, l'\xE9lagage synaptique, affine les circuits en fonction de l'exp\xE9rience."},{id:"neu36",type:"qcm",q:'"DOSE" est un moyen mn\xE9motechnique d\xE9signant les 4 grandes mol\xE9cules du bien-\xEAtre. Que signifie cet acronyme ?',options:["Dopamine, Ocytocine, S\xE9rotonine, Endorphine","Douleur, Oxyg\xE8ne, Stress, \xC9nergie","Digestion, \u0152strog\xE8ne, Sommeil, \xC9motion","D\xE9pression, Ob\xE9sit\xE9, Stress, \xC9puisement"],correct:0,explain:"Quatre neurochimiques souvent associ\xE9s aux m\xE9canismes de motivation et de bien-\xEAtre."},{id:"neu37",type:"qcm",q:'"NORACORT" est un moyen mn\xE9motechnique qui d\xE9signe la r\xE9action de stress, \xE0 partir de deux hormones. Lesquelles ?',options:["Noradr\xE9naline et cortisol","Nor\xE9pin\xE9phrine et insuline","Noradr\xE9naline et m\xE9latonine","Cortisol et ocytocine"],correct:0,explain:"Ces deux hormones sont au c\u0153ur de la r\xE9ponse physiologique au stress."},{id:"neu38",type:"qcm",q:"Parmi les d\xE9clencheurs de la r\xE9ponse de stress (NORACORT), on trouve notamment\u2026",options:["Le sentiment de perte de contr\xF4le","L'\xE9coute active d'un proche","La r\xE9solution d'un probl\xE8me","Le partage d'une ressource"],correct:0,explain:"Perdre le sentiment de contr\xF4le sur une situation est un d\xE9clencheur de stress classique."},{id:"neu39",type:"vf",q:'Parmi les d\xE9clencheurs de la r\xE9ponse de stress, on retrouve les "3 I" : incoh\xE9rence, incertitude et impr\xE9visibilit\xE9.',correct:!0,explain:"Trois facteurs qui, en rompant nos rep\xE8res habituels, activent la r\xE9ponse de stress."},{id:"neu40",type:"qcm",q:`Dans ce cadre, "l'effort" ressenti face \xE0 une t\xE2che serait d\xE9fini comme le rapport entre\u2026`,options:["Les ressources disponibles et les ressources \xE0 fournir","Le temps disponible et le temps n\xE9cessaire","La motivation et la fatigue","Le salaire et le nombre d'heures travaill\xE9es"],correct:0,explain:"Plus l'\xE9cart entre ce qu'on a et ce qu'il faudrait fournir est grand, plus l'effort per\xE7u est important."},{id:"neu41",type:"qcm",q:`L'"aversivit\xE9 \xE0 la perte" d\xE9signe la tendance \xE0\u2026`,options:["Ressentir la perte de fa\xE7on plus intense que le gain \xE9quivalent","Rechercher activement les pertes","\xCAtre totalement indiff\xE9rent aux pertes","Pr\xE9f\xE9rer perdre plut\xF4t que gagner"],correct:0,explain:"Une perte est g\xE9n\xE9ralement v\xE9cue de fa\xE7on plus marquante qu'un gain de m\xEAme ampleur."},{id:"neu42",type:"qcm",q:"La dopamine serait notamment produite en r\xE9action \xE0\u2026",options:["La r\xE9compense li\xE9e \xE0 l'atteinte d'un objectif","Le contact physique rassurant","Le fait d'\xEAtre \xE9cout\xE9 activement","La pratique d'une activit\xE9 sportive douce"],correct:0,explain:"Atteindre un objectif qu'on s'\xE9tait fix\xE9 est un d\xE9clencheur classique de production de dopamine."},{id:"neu43",type:"qcm",q:"Parmi les d\xE9clencheurs de dopamine, on trouve la nouveaut\xE9 et\u2026",options:["Le plaisir coupable","Le partage de ressources","L'\xE9coute active","Le rire partag\xE9"],correct:0,explain:"Un petit plaisir qu'on s'accorde, m\xEAme en le sachant discutable, peut activer ce circuit."},{id:"neu44",type:"vf",q:"\xC9viter une situation aversive peut, en soi, d\xE9clencher une production de dopamine.",correct:!0,explain:"Le simple fait de r\xE9ussir \xE0 \xE9viter un d\xE9sagr\xE9ment peut \xEAtre v\xE9cu comme gratifiant."},{id:"neu45",type:"qcm",q:"L'ocytocine serait notamment lib\xE9r\xE9e quand on a le sentiment de\u2026",options:["Faire partie d'un groupe","Avoir atteint un objectif difficile","Avoir \xE9vit\xE9 un danger","Avoir pris une d\xE9cision seul"],correct:0,explain:"Le sentiment d'appartenance \xE0 un groupe est un d\xE9clencheur classique de production d'ocytocine."},{id:"neu46",type:"vf",q:"Le contact physique favoriserait la production d'ocytocine, sauf s'il s'accompagne d'une rupture de coh\xE9rence.",correct:!0,explain:"Un contact qui contredit ce qu'on attendait de la situation peut au contraire devenir source de stress."},{id:"neu47",type:"qcm",q:`"Agir \xE0 plusieurs comme d'un seul" (par exemple dans un travail d'\xE9quipe synchronis\xE9) illustrerait un d\xE9clencheur\u2026`,options:["D'ocytocine","De cortisol","D'adr\xE9naline uniquement","Aucun d\xE9clencheur particulier"],correct:0,explain:"La coop\xE9ration et l'action collective coordonn\xE9e sont associ\xE9es \xE0 la production d'ocytocine."},{id:"neu48",type:"qcm",q:"Les endorphines seraient notamment lib\xE9r\xE9es apr\xE8s\u2026",options:["Une pratique sportive","Une d\xE9cision purement administrative","La lecture d'un contrat","Un calcul mental simple"],correct:0,explain:"L'activit\xE9 physique est l'un des d\xE9clencheurs les plus connus de la lib\xE9ration d'endorphines."},{id:"neu49",type:"vf",q:"Une forte activation du syst\xE8me nerveux autonome sympathique (r\xE9action de stress) pourrait \xEAtre suivie d'une lib\xE9ration d'endorphines.",correct:!0,explain:'Une sorte de "retour au calme" chimique apr\xE8s une activation intense du syst\xE8me de stress.'},{id:"neu50",type:"qcm",q:"Rires et pleurs partagent un point commun neurochimique : ils seraient tous deux associ\xE9s \xE0 une lib\xE9ration\u2026",options:["D'endorphines","D'adr\xE9naline uniquement","D'insuline","D'histamine"],correct:0,explain:"Deux expressions \xE9motionnelles tr\xE8s diff\xE9rentes, mais reli\xE9es au m\xEAme m\xE9canisme de lib\xE9ration d'endorphines."},{id:"neu51",type:"qcm",q:"La production de s\xE9rotonine serait li\xE9e \xE0 la reconnaissance. Laquelle de ces formes N'EN fait PAS partie ?",options:["La reconnaissance anonyme et non attribu\xE9e","La reconnaissance officielle","La reconnaissance officieuse d\xE9clarative","La reconnaissance officieuse non d\xE9clarative"],correct:0,explain:"Les 3 formes retenues supposent toutes qu'on sache d'o\xF9 vient la reconnaissance \u2014 contrairement \xE0 une reconnaissance anonyme."},{id:"neu52",type:"qcm",q:'Parmi les formes de revendication associ\xE9es \xE0 la s\xE9rotonine, on trouve "la d\xE9claration", "le faire" et\u2026',options:["La possession","L'oubli","Le refus","L'attente"],correct:0,explain:"Trois fa\xE7ons diff\xE9rentes de faire valoir sa valeur ou son statut : dire, agir, ou poss\xE9der."},{id:"neu53",type:"vf",q:"La production de s\xE9rotonine ne serait li\xE9e qu'\xE0 une reconnaissance strictement officielle, jamais informelle.",correct:!1,explain:"Deux des trois formes retenues sont au contraire officieuses (d\xE9clarative ou non d\xE9clarative), pas seulement officielle."}]},{id:"quiz-cnv",name:"Communication (CNV)",emoji:"\u{1F992}",questions:[{id:"cnv1",type:"qcm",q:"Les 4 \xE9tapes de la Communication Non Violente (Marshall Rosenberg) sont, dans l'ordre :",options:["Observation, sentiment, besoin, demande","\xC9coute, reproche, excuse, pardon","Jugement, \xE9motion, solution, accord","Fait, opinion, conseil, d\xE9cision"],correct:0,explain:"Le processus OSBD : Observation, Sentiment, Besoin, Demande. \u{1F9E0} Mn\xE9mo : \xAB On S'Bouge Doucement \xBB."},{id:"cnv2",type:"qcm",q:"Laquelle de ces phrases est une OBSERVATION pure (sans jugement) ?",options:["Hier, tu es rentr\xE9 \xE0 23 h.","Tu rentres toujours trop tard.","Tu te fiches de moi.","Tu es irresponsable."],correct:0,explain:"Une observation se filmerait avec une cam\xE9ra : un fait dat\xE9, sans \xAB toujours \xBB, sans interpr\xE9tation. \u{1F9E0} Mn\xE9mo : \xAB Si la cam\xE9ra ne le voit pas, ce n'est pas une observation \xBB."},{id:"cnv3",type:"vf",q:"\xAB Tu ne m'\xE9coutes jamais \xBB est une observation.",correct:!1,explain:"\xAB Jamais \xBB est une g\xE9n\xE9ralisation : c'est un jugement d\xE9guis\xE9. Observer, ce serait : \xAB Hier soir, pendant que je parlais, tu regardais ton t\xE9l\xE9phone \xBB."},{id:"cnv4",type:"qcm",q:"Pour transformer \xAB Tu es d\xE9sordonn\xE9 \xBB en observation, on dirait plut\xF4t :",options:["\xAB Il y a trois tasses et deux pulls sur la table du salon. \xBB","\xAB Tu es vraiment bord\xE9lique. \xBB","\xAB Tu pourrais faire un effort. \xBB","\xAB Tu fais expr\xE8s de tout laisser tra\xEEner. \xBB"],correct:0,explain:"On d\xE9crit ce qu'on voit, pas ce qu'on pense de la personne."},{id:"cnv5",type:"vf",q:"Dire \xAB tu es toujours en retard \xBB ou \xAB tu es en retard \xBB est sans risque, car c'est un simple constat.",correct:!1,explain:"\xAB Toujours \xBB et \xAB \xEAtre en retard \xBB (\xE9tiquette) \xE9valuent la personne. Observer : \xAB Ce soir, tu es arriv\xE9 \xE0 20 h 30 pour un rendez-vous \xE0 20 h \xBB."},{id:"cnv6",type:"qcm",q:"Laquelle de ces phrases exprime un vrai SENTIMENT ?",options:["Je me sens triste.","Je me sens incompris.","Je me sens rejet\xE9.","Je me sens manipul\xE9."],correct:0,explain:"\xAB Incompris \xBB, \xAB rejet\xE9 \xBB, \xAB manipul\xE9 \xBB contiennent une accusation sur l'autre : ce sont des faux sentiments. \xAB Triste \xBB d\xE9crit seulement ce qui se passe en moi."},{id:"cnv7",type:"vf",q:"\xAB Je me sens abandonn\xE9 \xBB est un sentiment au sens de la CNV.",correct:!1,explain:"\xAB Abandonn\xE9 \xBB suppose que quelqu'un m'a abandonn\xE9 : c'est une interpr\xE9tation de son acte. Le vrai sentiment dessous peut \xEAtre la tristesse, la peur, la solitude."},{id:"cnv8",type:"qcm",q:"Quelle formulation exprime un sentiment sans accuser ?",options:["\xAB Je suis inquiet. \xBB","\xAB Je me sens trahi. \xBB","\xAB Je me sens ignor\xE9. \xBB","\xAB Je me sens utilis\xE9. \xBB"],correct:0,explain:"Astuce : si on peut remplacer \xAB je me sens \xBB par \xAB je pense que tu\u2026 \xBB, ce n'est pas un sentiment. \u{1F9E0} Mn\xE9mo : \xAB Je me sens + adjectif sur MOI \xBB."},{id:"cnv9",type:"vf",q:"Dans la CNV, mes sentiments sont caus\xE9s par les actes de l'autre.",correct:!1,explain:"Le comportement de l'autre est un STIMULUS ; la cause, c'est mon besoin satisfait ou non. Cela permet d'assumer ses \xE9motions sans accuser."},{id:"cnv10",type:"qcm",q:"Selon la CNV, quelle est la cause profonde d'un sentiment de col\xE8re ?",options:["Un besoin non satisfait","Le comportement de l'autre","Un mauvais caract\xE8re","Un manque de ma\xEEtrise de soi"],correct:0,explain:"Derri\xE8re chaque sentiment, il y a un besoin combl\xE9 (joie) ou non combl\xE9 (col\xE8re, tristesse...). \u{1F9E0} Mn\xE9mo : \xAB Sous l'\xE9motion, le besoin \xBB."},{id:"cnv11",type:"qcm",q:"Lequel de ces \xE9l\xE9ments est un BESOIN (et non une strat\xE9gie) ?",options:["Le repos","Que tu ranges la cuisine","Partir en week-end","Que tu me rappelles"],correct:0,explain:"Un besoin est universel et ne d\xE9pend d'aucune personne, lieu ou moment. Ranger, partir, rappeler = strat\xE9gies pour y r\xE9pondre."},{id:"cnv12",type:"vf",q:"\xAB J'ai besoin que tu m'aides \xE0 la vaisselle \xBB exprime un besoin au sens de la CNV.",correct:!1,explain:"C'est une strat\xE9gie : elle mentionne une personne et une action. Le besoin sous-jacent peut \xEAtre le soutien, la coop\xE9ration ou le repos."},{id:"cnv13",type:"qcm",q:"Pourquoi distinguer besoin et strat\xE9gie ?",options:["Un besoin peut \xEAtre satisfait de mille fa\xE7ons, une strat\xE9gie est souvent source de conflit","Parce que les strat\xE9gies sont toujours mauvaises","Parce que les besoins sont secrets","Parce que les besoins ne s'expriment pas"],correct:0,explain:"On peut s'accorder sur les besoins m\xEAme quand on se dispute sur les strat\xE9gies. \u{1F9E0} Mn\xE9mo : \xAB Besoin = pourquoi, strat\xE9gie = comment \xBB."},{id:"cnv14",type:"qcm",q:"\xAB J'ai besoin de calme \xBB : que peut-on dire de cette phrase ?",options:["C'est un vrai besoin, universel","C'est une strat\xE9gie","C'est une exigence","C'est un jugement"],correct:0,explain:"Le calme (comme le repos, la s\xE9curit\xE9, la reconnaissance, l'autonomie) est un besoin universel que chacun partage."},{id:"cnv15",type:"qcm",q:"Laquelle de ces phrases est une DEMANDE de la CNV ?",options:["\xAB Peux-tu me dire ce que tu as compris de ce que je viens de dire ? \xBB","\xAB Sois plus attentif. \xBB","\xAB Arr\xEAte de m'interrompre ! \xBB","\xAB Fais un effort un jour. \xBB"],correct:0,explain:"Une demande est concr\xE8te, positive (ce que je veux, pas ce que je ne veux pas), r\xE9alisable, au pr\xE9sent. \u{1F9E0} Mn\xE9mo : \xAB Concret, positif, possible, maintenant \xBB."},{id:"cnv16",type:"vf",q:"Une bonne demande formule ce que l'on veut, pas ce que l'on ne veut pas.",correct:!0,explain:"\xAB Arr\xEAte de crier \xBB dit ce qu'on ne veut pas ; \xAB Peux-tu parler plus doucement ? \xBB dit ce qu'on veut."},{id:"cnv17",type:"qcm",q:"Comment reconna\xEEt-on une EXIGENCE d\xE9guis\xE9e en demande ?",options:["Quand un \xAB non \xBB provoque reproche, culpabilisation ou punition","Quand elle est polie","Quand elle est courte","Quand elle est \xE9crite"],correct:0,explain:"Si l'autre craint de dire non, c'est une exigence. Une vraie demande accepte un refus et \xE9coute le besoin derri\xE8re. \u{1F9E0} Mn\xE9mo : \xAB Demande = non possible \xBB."},{id:"cnv18",type:"qcm",q:"Laquelle de ces demandes est la plus claire ?",options:["\xAB Peux-tu \xE9teindre la t\xE9l\xE9 \xE0 22 h ce soir ? \xBB","\xAB Sois plus respectueux. \xBB","\xAB Respecte-moi un peu. \xBB","\xAB Ce serait bien que tu penses \xE0 moi. \xBB"],correct:0,explain:"Pr\xE9cise, dat\xE9e et faisable. \xAB Sois plus respectueux \xBB est un v\u0153u vague, pas une action observable."},{id:"cnv19",type:"vf",q:"Apr\xE8s avoir exprim\xE9 une demande, on peut aussi demander \xE0 l'autre de reformuler ce qu'il a compris.",correct:!0,explain:"C'est une \xAB demande de connexion \xBB : v\xE9rifier que le message est pass\xE9 avant de passer \xE0 l'action."},{id:"cnv20",type:"qcm",q:"Quel est le principe de l'empathie en CNV ?",options:["\xC9couter les sentiments et besoins de l'autre, sans conseiller ni analyser","Donner des conseils pour r\xE9soudre son probl\xE8me","Lui dire que \xE7a pourrait \xEAtre pire","Lui raconter une exp\xE9rience similaire"],correct:0,explain:"L'empathie est une pr\xE9sence : on accueille, sans rien ajouter. \u{1F9E0} Mn\xE9mo : \xAB \xC9couter pour entendre, pas pour r\xE9pondre \xBB."},{id:"cnv21",type:"qcm",q:"Magali dit : \xAB J'ai eu une journ\xE9e horrible \xBB. Laquelle de ces r\xE9ponses est empathique ?",options:["\xAB Tu t'es senti(e) \xE9puis\xE9(e) et tu aurais voulu de la tranquillit\xE9 ? \xBB","\xAB Moi, j'ai eu pire hier. \xBB","\xAB Tu devrais prendre un bain chaud. \xBB","\xAB Ce n'est pas si grave. \xBB"],correct:0,explain:"Reformuler sentiment + besoin. Les autres sont des r\xE9flexes non empathiques : comparer, conseiller, minimiser."},{id:"cnv22",type:"vf",q:"Conseiller (\xAB \xC0 ta place, je ferais \xE7a \xBB) est une fa\xE7on d'\xEAtre empathique.",correct:!1,explain:"Conseiller, consoler, minimiser, enqu\xEAter, expliquer... font partie des r\xE9flexes qui coupent l'empathie. \xC9couter d'abord, conseiller seulement si on te le demande."},{id:"cnv23",type:"qcm",q:"Parmi ces r\xE9ponses, laquelle COUPE l'empathie ?",options:["\xAB Ne t'en fais pas, \xE7a va s'arranger. \xBB","\xAB Tu te sens d\xE9courag\xE9 ? \xBB","\xAB Tu as besoin de soutien ? \xBB","\xAB Veux-tu m'en dire plus ? \xBB"],correct:0,explain:"Consoler trop vite emp\xEAche la personne de se sentir entendue. Les autres r\xE9ponses accueillent ce qu'elle vit."},{id:"cnv24",type:"vf",q:"Se taire et rester pr\xE9sent peut \xEAtre une forme d'empathie.",correct:!0,explain:"L'empathie n'est pas une technique verbale : c'est la qualit\xE9 de pr\xE9sence. Parfois un silence attentif vaut mieux que mille reformulations."},{id:"cnv25",type:"qcm",q:"Dans l'image de Rosenberg, que repr\xE9sentent la girafe et le chacal ?",options:["La girafe : langage du c\u0153ur (CNV) ; le chacal : langage du jugement","La girafe : la col\xE8re ; le chacal : la joie","La girafe : le travail ; le chacal : le repos","La girafe : les hommes ; le chacal : les femmes"],correct:0,explain:"La girafe a le plus grand c\u0153ur des animaux terrestres ; le chacal juge, reproche, critique. Il y a un chacal en chacun de nous : on ne le chasse pas, on l'\xE9coute."},{id:"cnv26",type:"vf",q:"Le chacal int\xE9rieur est un ennemi qu'il faut faire taire.",correct:!1,explain:"M\xEAme le chacal exprime un besoin non satisfait. On l'\xE9coute avec bienveillance pour traduire son jugement en besoin (auto-empathie)."},{id:"cnv27",type:"qcm",q:"Face \xE0 un reproche re\xE7u, que propose la CNV en premier ?",options:["Se demander quels besoins se cachent derri\xE8re","Se justifier tout de suite","Contre-attaquer","Quitter la pi\xE8ce"],correct:0,explain:"Entendre le besoin derri\xE8re le reproche d\xE9samorce la tension. Quatre options existent : se bl\xE2mer, bl\xE2mer l'autre, \xE9couter ses propres sentiments/besoins, \xE9couter ceux de l'autre."},{id:"cnv28",type:"qcm",q:"Quelle est la diff\xE9rence entre \xAB me bl\xE2mer \xBB et \xAB m'auto-empathiser \xBB ?",options:["Me bl\xE2mer = \xAB je suis nul \xBB ; auto-empathie = \xAB je suis triste, j'avais besoin de bien faire \xBB","Aucune diff\xE9rence","L'auto-empathie consiste \xE0 se trouver des excuses","Me bl\xE2mer est plus honn\xEAte"],correct:0,explain:"L'auto-empathie reconna\xEEt ses sentiments et besoins sans se condamner : on peut regretter un acte sans se juger comme personne."},{id:"cnv29",type:"qcm",q:"Pour Rosenberg, la col\xE8re est avant tout :",options:["Un signal qu'un besoin n'est pas satisfait, aliment\xE9 par une pens\xE9e de reproche","Un d\xE9faut de caract\xE8re","Une preuve que l'autre a tort","Un sentiment \xE0 r\xE9primer"],correct:0,explain:"La col\xE8re na\xEEt des pens\xE9es \xAB il/elle devrait\u2026 \xBB. Derri\xE8re : un besoin. Marche \xE0 suivre : 1) stop, 2) respirer, 3) identifier la pens\xE9e, 4) relier au besoin, 5) exprimer en OSBD. \u{1F9E0} Mn\xE9mo : \xAB Col\xE8re = besoin qui crie \xBB."},{id:"cnv30",type:"qcm",q:"En CNV, un remerciement authentique contient :",options:["Ce que l'autre a fait, ce que je ressens et le besoin combl\xE9","Un compliment sur la personne","Un \xAB bravo \xBB g\xE9n\xE9ral","Une demande cach\xE9e"],correct:0,explain:"\xAB Quand tu as pr\xE9par\xE9 le d\xEEner (action), j'\xE9tais soulag\xE9 (sentiment) : j'avais besoin de repos (besoin) \xBB. Pas un jugement positif, mais un partage de ce que l'acte a rendu possible."},{id:"cnv31",type:"vf",q:"Dire \xAB tu es g\xE9nial \xBB est de la gratitude au sens de la CNV.",correct:!1,explain:"C'est un jugement positif, une \xE9tiquette sur la personne. La gratitude CNV d\xE9crit l'acte pr\xE9cis, l'\xE9motion et le besoin combl\xE9."},{id:"cnv32",type:"qcm",q:"Parmi ces expressions, laquelle est un \xAB langage ali\xE9nant \xBB (qui nie la responsabilit\xE9) ?",options:["\xAB Je suis oblig\xE9 de le faire. \xBB","\xAB J'ai choisi de le faire parce que\u2026 \xBB","\xAB J'ai envie de\u2026 \xBB","\xAB Je pr\xE9f\xE8re\u2026 \xBB"],correct:0,explain:"\xAB Je dois \xBB, \xAB il faut \xBB, \xAB je suis oblig\xE9 \xBB masquent le choix. Remplacer par \xAB je choisis de\u2026 parce que j'ai besoin de\u2026 \xBB. \u{1F9E0} Mn\xE9mo : \xAB Remplace \xAB il faut \xBB par \xAB je choisis \xBB \xBB."},{id:"cnv33",type:"vf",q:"Le mot \xAB devoir \xBB (\xAB tu dois \xBB, \xAB il faut \xBB) est un des langages qui nient la libert\xE9 de choix.",correct:!0,explain:"Il existe aussi la comparaison, les jugements moralisants, le d\xE9ni de responsabilit\xE9 (\xAB c'est la faute \xE0\u2026 \xBB) et les exigences."},{id:"cnv34",type:"qcm",q:"\xAB Il m'a fait enrager \xBB est un exemple de :",options:["D\xE9ni de responsabilit\xE9","Observation","Demande","Besoin"],correct:0,explain:"Je rends l'autre responsable de ma col\xE8re. En CNV : \xAB Quand il a dit cela, j'ai ressenti de la col\xE8re car j'avais besoin de respect \xBB."},{id:"cnv35",type:"qcm",q:"Quand la CNV autorise-t-elle la force ?",options:["Quand elle est protectrice (\xE9viter un danger), sans intention de punir","Quand l'autre a tort","Quand on a d\xE9j\xE0 tout essay\xE9","Jamais, en aucun cas"],correct:0,explain:"La force protectrice emp\xEAche un dommage (arracher un enfant \xE0 la route) ; la force punitive vise \xE0 faire souffrir pour \xAB apprendre une le\xE7on \xBB."},{id:"cnv36",type:"vf",q:"Punir un enfant le fait agir par d\xE9sir sinc\xE8re de contribuer \xE0 la vie de la famille.",correct:!1,explain:"La punition am\xE8ne l'ob\xE9issance par peur ou culpabilit\xE9. Rosenberg pr\xE9f\xE8re que chacun agisse \xAB par compassion \xBB, non par crainte de la sanction ni espoir de r\xE9compense."},{id:"cnv37",type:"qcm",q:"En situation de conflit, que recommande Rosenberg avant de chercher une solution ?",options:["Que chacun exprime ses besoins et entende ceux de l'autre","D\xE9signer un coupable","Trouver un compromis rapide","Faire appel \xE0 un arbitre"],correct:0,explain:"On dissout le conflit en se reliant d'abord aux besoins de chacun ; les solutions surgissent ensuite. \u{1F9E0} Mn\xE9mo : \xAB Besoins d'abord, strat\xE9gies ensuite \xBB."},{id:"cnv38",type:"qcm",q:"Un compromis o\xF9 chacun c\xE8de \xE0 contre-c\u0153ur est :",options:["Insatisfaisant en CNV : on cherche une solution qui r\xE9pond aux besoins de tous","L'objectif ultime","Toujours pr\xE9f\xE9rable","Une victoire"],correct:0,explain:"La CNV cherche une solution o\xF9 les besoins de chacun sont honor\xE9s, pas un partage de la frustration."},{id:"cnv39",type:"qcm",q:"Pour accueillir un \xAB non \xBB de l'autre, en CNV, on :",options:["Entend le besoin que ce \xAB non \xBB prot\xE8ge","Insiste jusqu'\xE0 ce qu'il c\xE8de","Le prend comme un rejet personnel","Fait la t\xEAte"],correct:0,explain:"Derri\xE8re un \xAB non \xBB il y a un \xAB oui \xBB \xE0 un autre besoin. L'entendre ouvre la recherche d'une autre strat\xE9gie. \u{1F9E0} Mn\xE9mo : \xAB Tout non cache un oui \xBB."},{id:"cnv40",type:"vf",q:"Dire \xAB non \xBB de fa\xE7on claire et bienveillante est compatible avec la CNV.",corre

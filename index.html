:["R\xE9guler la transpiration excessive et les bouff\xE9es de chaleur","Stimuler l'app\xE9tit uniquement","Calmer la toux s\xE8che","Aucun usage traditionnel connu"],correct:0,explain:"Elle est souvent propos\xE9e en accompagnement de la m\xE9nopause."},{id:"pl49",type:"vf",q:"La sauge officinale, riche en thuyone, est d\xE9conseill\xE9e en usage prolong\xE9 pendant la grossesse.",correct:!0,explain:"La thuyone peut \xEAtre neurotoxique \xE0 haute dose."},{id:"pl50",type:"qcm",q:"La verveine odorante (verveine citronn\xE9e) est surtout appr\xE9ci\xE9e en tisane pour ses vertus\u2026",options:["Digestives et apaisantes","Stimulantes et excitantes","Anesth\xE9siantes","Diur\xE9tiques puissantes"],correct:0,explain:"Une infusion classique apr\xE8s le repas, appr\xE9ci\xE9e pour son parfum citronn\xE9."},{id:"pl51",type:"qcm",q:"La cannelle est traditionnellement associ\xE9e \xE0 un effet favorable sur\u2026",options:["La r\xE9gulation de la glyc\xE9mie","La coagulation sanguine","La vision nocturne","Aucun effet traditionnel connu"],correct:0,explain:"Un usage traditionnel \xE9tudi\xE9, \xE0 ne pas substituer \xE0 un traitement m\xE9dical."},{id:"pl52",type:"vf",q:"La cannelle de Cassia (la plus courante) contient davantage de coumarine que la cannelle de Ceylan, ce qui limite les quantit\xE9s recommand\xE9es.",correct:!0,explain:'La cannelle de Ceylan, dite "vraie cannelle", en contient beaucoup moins.'},{id:"pl53",type:"qcm",q:"Le clou de girofle est traditionnellement utilis\xE9, m\xE2ch\xE9 ou en application locale, pour\u2026",options:["Apaiser une douleur dentaire","Faire baisser la fi\xE8vre","Stimuler la pousse des cheveux","Aucun usage traditionnel connu"],correct:0,explain:"Il contient de l'eug\xE9nol, aux propri\xE9t\xE9s antalgiques locales."},{id:"pl54",type:"qcm",q:"La cardamome, \xE9pice tr\xE8s utilis\xE9e dans le chai indien, est traditionnellement reconnue pour faciliter\u2026",options:["La digestion","La cicatrisation des plaies","La circulation san igestion","L'endormissement","La circulation sanguine","Aucun usage traditionnel connu"],correct:0,explain:"Une \xE9pice courante dans de nombreuses cuisines du monde."},{id:"pl77",type:"qcm",q:"En phytoth\xE9rapie, la camomille allemande (matricaire) est traditionnellement plut\xF4t associ\xE9e \xE0\u2026",options:["Un usage digestif et anti-inflammatoire","Un usage exclusivement cosm\xE9tique","Un usage anesth\xE9siant fort","Aucun usage traditionnel connu"],correct:0,explain:"La camomille romaine est, elle, plut\xF4t r\xE9put\xE9e pour son effet calmant nerveux."},{id:"pl78",type:"vf",q:"La ciboulette perd une grande partie de sa saveur si on la fait cuire longtemps : elle s'ajoute donc en fin de cuisson.",correct:!0,explain:"C'est pourquoi on la ciselle fra\xEEche, juste avant de servir."},{id:"pl79",type:"qcm",q:'Le cerfeuil, une des "fines herbes" fran\xE7aises, est traditionnellement associ\xE9 \xE0 un go\xFBt\u2026',options:["L\xE9g\xE8rement anis\xE9","Tr\xE8s piquant","Amer et poivr\xE9","Sucr\xE9 comme la r\xE9glisse"],correct:0,explain:"Un parfum d\xE9licat, plus discret que le persil ou l'estragon."},{id:"pl80",type:"qcm",q:"Le paprika, \xE9pice obtenue \xE0 partir de piments s\xE9ch\xE9s et moulus, est traditionnellement associ\xE9 \xE0 la cuisine\u2026",options:["Hongroise et espagnole","Japonaise","Scandinave","Aucune cuisine en particulier"],correct:0,explain:"Il peut \xEAtre doux ou fum\xE9 selon la vari\xE9t\xE9 de piment et le s\xE9chage."},{id:"pl81",type:"qcm",q:"La badiane, le clou de girofle et la cannelle sont des \xE9pices que l'on retrouve fr\xE9quemment ensemble dans\u2026",options:["Le pain d'\xE9pices et les vins chauds d'hiver","Les salades d'\xE9t\xE9","Les sorbets aux fruits rouges","Aucun usage culinaire courant"],correct:0,explain:`Ce trio d'\xE9pices "chaudes" est classique des recettes hivernales.`},{id:"pl82",type:"vf",q:"Le persil contient, \xE0 poids \xE9gal, davantage de vitamine C que certains agrumes.",correct:!0,explain:"I cm",q:'Certains chapitres du "livre des plantes" de la Physica ne traitent en r\xE9alit\xE9 pas de plantes, mais de\u2026',options:["Miel, sucre, lait, beurre, sel, \u0153ufs...","Min\xE9raux et pierres pr\xE9cieuses","Instruments de cuisine","Animaux de la ferme"],correct:0,explain:'Une dizaine de chapitres "intrus" traitent de ce type de sujets, ce qui complique le d\xE9compte r\xE9el des plantes d\xE9crites.'}]},{id:"quiz-neuro",name:"Neurosciences",emoji:"\u{1F9E0}",questions:[{id:"nr1",type:"qcm",q:"Combien de neurones compte environ le cerveau humain adulte ?",options:["86 milliards","1 milliard","500 millions","1000 milliards"],correct:0,explain:"Un chiffre souvent cit\xE9, bien loin des id\xE9es re\xE7ues plus modestes."},{id:"nr2",type:"vf",q:"Nous n'utilisons que 10% de notre cerveau.",correct:!1,explain:"Neuromythe : l'imagerie c\xE9r\xE9brale montre une activit\xE9 r\xE9partie dans tout le cerveau."},{id:"nr3",type:"qcm",q:"Quelle structure est principalement associ\xE9e \xE0 la m\xE9moire ?",options:["Hippocampe","Cervelet","Bulbe rachidien","Thalamus"],correct:0,explain:"L'hippocampe est central pour former de nouveaux souvenirs."},{id:"nr4",type:"vf",q:"Le cerveau humain p\xE8se environ 1,3 \xE0 1,4 kg en moyenne.",correct:!0,explain:"Un poids qui varie peu d'un adulte \xE0 l'autre."},{id:"nr5",type:"qcm",q:"Quel neurotransmetteur est souvent associ\xE9 au plaisir et \xE0 la r\xE9compense ?",options:["Dopamine","S\xE9rotonine","GABA","Ac\xE9tylcholine"],correct:0,explain:"La dopamine est le neurotransmetteur cl\xE9 du circuit de la r\xE9compense."},{id:"nr6",type:"vf",q:"Les neurones peuvent se r\xE9g\xE9n\xE9rer dans certaines r\xE9gions du cerveau (neurogen\xE8se).",correct:!0,explain:"La neurogen\xE8se adulte existe notamment dans l'hippocampe."},{id:"nr7",type:"qcm",q:"Quel est le r\xF4le principal du cervelet ?",options:["Coordination des mouvements","Vision","Langage","Digestion"],correct:0,explain:"Le cervelet ajuste pr\xE9cision et \xE9quilibr

bl\xE9e ou construite","Moins de valeur \xE0 ce qu'on a fabriqu\xE9 soi-m\xEAme","Aucune valeur particuli\xE8re au fait-main","De la valeur uniquement aux objets achet\xE9s chers"],correct:0,explain:"Fabriquer soi-m\xEAme augmenterait la valeur per\xE7ue de l'objet."},{id:"bias8",type:"vf",q:`Le "biais social" (ou preuve sociale) pousse \xE0 adopter un comportement d'autant plus facilement qu'on voit beaucoup d'autres personnes l'adopter.`,correct:!0,explain:"Voir les autres agir pareil rassure et pousse \xE0 suivre."},{id:"bias9",type:"qcm",q:`Le "biais de disponibilit\xE9" fait qu'on surestime la fr\xE9quence d'un \xE9v\xE8nement\u2026`,options:["Quand des exemples nous viennent facilement \xE0 l'esprit","Quand on n'y a jamais pens\xE9","Uniquement s'il est \xE9crit dans un livre","Jamais, ce biais n'affecte pas les probabilit\xE9s per\xE7ues"],correct:0,explain:"Ce qui est facile \xE0 se rappeler parait plus fr\xE9quent qu'il ne l'est."},{id:"bias10",type:"qcm",q:`Le "biais d'association" d\xE9signe la tendance \xE0 juger une chose\u2026`,options:["En fonction de ce \xE0 quoi elle est inconsciemment associ\xE9e","Uniquement sur des faits v\xE9rifi\xE9s","Sans aucun lien avec le contexte","De fa\xE7on parfaitement neutre"],correct:0,explain:"Une association inconsciente peut influencer un jugement sans lien logique direct."},{id:"bias11",type:"vf",q:"Un biais cognitif est un raccourci de pens\xE9e qui peut mener \xE0 un jugement syst\xE9matiquement fauss\xE9, sans qu'on en ait forc\xE9ment conscience.",correct:!0,explain:"Un raccourci de pens\xE9e, souvent automatique et inconscient."},{id:"bias12",type:"qcm",q:"Parmi ces exemples, lequel illustre le mieux le biais de r\xE9ciprocit\xE9 ?",options:["Un vendeur offre un petit cadeau, ce qui donne envie d'acheter en retour","Un client compare deux prix c\xF4te \xE0 c\xF4te","Une personne suit la foule sans r\xE9fl\xE9chir","Quelqu'un change d'avis apr\xE8s un contre-argument"],correct:0,explain:"Un petit geste gratuit incite \xE0 un geste en retour."},{id:"bias13",type:"vf",q:"Se souvenir d'un \xE9v\xE9nement marquant ou r\xE9cent peut suffire \xE0 nous faire surestimer sa probabilit\xE9 r\xE9elle (biais de disponibilit\xE9).",correct:!0,explain:"Un exemple marquant suffit \xE0 fausser l'estimation d'une probabilit\xE9."},{id:"bias14",type:"qcm",q:`Pourquoi le "biais de coh\xE9rence" est-il \xE0 surveiller quand on \xE9value quelqu'un dans le temps ?`,options:["Parce qu'un profil vaut \xE0 un instant T et peut \xE9voluer selon le contexte","Parce qu'il n'existe qu'en laboratoire","Parce qu'il n'affecte que les enfants","Parce qu'il dispara\xEEt apr\xE8s 24h"],correct:0,explain:"Le contexte change, l'\xE9valuation devrait donc \xEAtre r\xE9\xE9valu\xE9e r\xE9guli\xE8rement."},{id:"bias15",type:"vf",q:"Le fait d'avoir \xE9crit ou d\xE9clar\xE9 publiquement une intention rend g\xE9n\xE9ralement plus probable qu'on s'y tienne (biais d'engagement).",correct:!0,explain:"S'engager par \xE9crit renforcerait la probabilit\xE9 de tenir parole."},{id:"bias16",type:"qcm",q:"Dans une n\xE9gociation, pr\xE9senter d'abord un prix \xE9lev\xE9 puis un prix plus bas exploite surtout\u2026",options:["Le biais de contraste","Le biais de disponibilit\xE9","L'effet Ikea","Le biais d'association"],correct:0,explain:"Un prix de r\xE9f\xE9rence \xE9lev\xE9 rend le suivant plus attractif par comparaison."},{id:"bias17",type:"vf",q:"Les biais cognitifs sont uniquement le fait de personnes peu r\xE9fl\xE9chies ou peu \xE9duqu\xE9es.",correct:!1,explain:"Ce sont des m\xE9canismes universels de la pens\xE9e humaine."},{id:"bias18",type:"qcm",q:"Voir beaucoup d'avis positifs sur un produit avant de l'acheter influence surtout\u2026",options:["Le biais social (preuve sociale)","Le biais de contraste","L'effet Ikea","Le biais de disponibilit\xE9"],correct:0,explain:"Les avis des autres rassurent et orientent la d\xE9cision."},{id:"bias19",type:"vf",q:"\xCAtre conscient de l'existence d'un biais suffit toujours \xE0 s'en prot\xE9ger compl\xE8tement.",correct:!1,explain:"Conna\xEEtre un biais aide, mais ne suffit pas toujours \xE0 l'\xE9viter."},{id:"bias20",type:"qcm",q:`Monter soi-m\xEAme un meuble et le trouver ensuite plus "beau" ou "pr\xE9cieux" qu'un meuble \xE9quivalent d\xE9j\xE0 mont\xE9 illustre\u2026`,options:["L'effet Ikea","Le biais de r\xE9ciprocit\xE9","Le biais de contraste","Le biais social"],correct:0,explain:"Investir du temps et de l'effort ferait na\xEEtre un attachement."},{id:"bmo25",type:"qcm",q:"Que se passerait-il, selon certains mod\xE8les de neurosciences appliqu\xE9es, quand on rit ensemble avec quelqu'un ?",options:["Lib\xE9ration d'ocytocine (partage) et de dopamine","Uniquement de la s\xE9rotonine","Aucune lib\xE9ration hormonale particuli\xE8re","Uniquement du cortisol"],correct:0,explain:"Le rire partag\xE9 renforcerait \xE0 la fois le lien et le plaisir."},{id:"bmo26",type:"vf",q:"L'humour serait d\xE9crit comme une r\xE9solution de rupture de coh\xE9rence, de fa\xE7on soudaine et inattendue.",correct:!0,explain:"L'humour surprend en d\xE9nouant une tension de fa\xE7on inattendue."},{id:"bmo27",type:"qcm",q:"Un grand fou rire serait plut\xF4t associ\xE9 \xE0 la lib\xE9ration de\u2026",options:["Endorphines","Testost\xE9rone uniquement","Cortisol uniquement","Rien de particulier"],correct:0,explain:"Un fou rire prolong\xE9 lib\xE9rerait des endorphines apaisantes."},{id:"bmo28",type:"qcm",q:"Quelles seraient les 3 grandes fonctions du cerveau ?",options:["Acc\xE8s aux ressources, survie, reproduction","M\xE9moire, langage, calcul","Vision, audition, \xE9quilibre","Sommeil, digestion, respiration"],correct:0,explain:"Trois besoins fondamentaux souvent cit\xE9s en biologie du comportement."},{id:"bmo29",type:"vf",q:"Le mythe de l'asym\xE9trie c\xE9r\xE9brale (cerveau droit / cerveau gauche) aurait \xE9t\xE9 d\xE9menti seulement quelques mois apr\xE8s sa diffusion initiale.",correct:!0,explain:"Une id\xE9e populaire vite invalid\xE9e par la suite."},{id:"bmo30",type:"qcm",q:"Selon la formation, combien de sens pourrait-on isoler au total, au-del\xE0 des 9 sens principaux ?",options:["Entre 26 et 28","Exactement 5","Exactement 12","Plus de 100"],correct:0,explain:"Au-del\xE0 des 9 sens principaux, on distingue parfois des variantes plus fines."},{id:"bmo31",type:"qcm",q:"Dans l'exemple donn\xE9 dans certains mod\xE8les de neurosciences appliqu\xE9es, en combien de temps le cerveau identifierait-il un objet per\xE7u, avant toute conscience ?",options:["Entre 80 et 120 millisecondes","Plusieurs secondes","Plusieurs minutes","Instantan\xE9ment, sans d\xE9lai mesurable"],correct:0,explain:"Le cerveau identifierait un objet avant m\xEAme qu'on en ait conscience."},{id:"bmo32",type:"vf",q:'La zone orbito-frontale interviendrait dans un second temps, pour "conscientiser" une d\xE9cision d\xE9j\xE0 amorc\xE9e ailleurs dans le cerveau.',correct:!0,explain:"Cette zone interviendrait apr\xE8s la d\xE9cision, pour la rendre consciente."},{id:"bmo33",type:"qcm",q:'Le "pi\xE8ge abscons" \xE9voqu\xE9 dans certains mod\xE8les de neurosciences appliqu\xE9es d\xE9crit le fait que\u2026',options:["Plus on investit de ressources dans un objectif, moins on est pr\xEAt \xE0 abandonner","On abandonne plus facilement apr\xE8s un petit investissement","Les objectifs n'ont aucune influence sur l'engagement","Il n'y a aucun lien entre investissement et abandon"],correct:0,explain:"Plus on investit, plus il est difficile psychologiquement de renoncer."},{id:"bmo34",type:"qcm",q:"Comment pourrait-on d\xE9crire la procrastination, au niveau c\xE9r\xE9bral ?",options:["Le cerveau per\xE7oit une plus grande satisfaction \xE0 ne rien faire qu'\xE0 agir","Un simple manque de volont\xE9","Une maladie neurologique rare","Un exc\xE8s de dopamine uniquement"],correct:0,explain:"Le cerveau pr\xE9f\xE9rerait parfois l'inaction \xE0 l'action, \xE0 court terme."},{id:"bmo35",type:"vf",q:`Le "syndrome de l'imposteur" serait li\xE9 \xE0 la peur de d\xE9couvrir un \xE9cart entre l'image qu'on projette et la r\xE9alit\xE9.`,correct:!0,explain:"La peur de ne pas \xEAtre \xE0 la hauteur de l'image projet\xE9e."},{id:"bmo36",type:"qcm",q:'Parmi les conditions de d\xE9clenchement de stress ("Noracort") cit\xE9es, laquelle est mentionn\xE9e ?',options:["Le sentiment de perte de contr\xF4le","La faim uniquement","Le fait d'\xEAtre seul","La m\xE9t\xE9o"],correct:0,explain:"Perdre le sentiment de contr\xF4le serait un d\xE9clencheur de stress courant."},{id:"bmo37",type:"vf",q:"L'incoh\xE9rence, l'incertitude et l'impr\xE9visibilit\xE9 feraient partie des d\xE9clencheurs de stress les plus courants.",correct:!0,explain:"L'incertitude et l'impr\xE9vu sont des sources de tension classiques."},{id:"bmo38",type:"qcm",q:"Parmi les conditions de production de dopamine cit\xE9es, laquelle concerne les m\xE9dias et les mauvaises nouvelles ?",options:["Le plaisir coupable","Le calme et la routine","L'ennui","Le silence"],correct:0,explain:"Les mauvaises nouvelles capteraient particuli\xE8rement l'attention."},{id:"bmo39",type:"qcm",q:"Selon la formation, la testost\xE9rone serait li\xE9e en priorit\xE9 \xE0\u2026",options:["La tension au d\xE9sir sexuel","La m\xE9moire \xE0 long terme","Le sommeil profond","La digestion"],correct:0,explain:"Une hormone associ\xE9e \xE0 la tension du d\xE9sir, chez les deux sexes."},{id:"bmo40",type:"vf",q:"D'apr\xE8s la formation, les femmes produiraient en moyenne moins de testost\xE9rone que les hommes, mais y seraient plus sensibles.",correct:!0,explain:"Une diff\xE9rence de dosage et de sensibilit\xE9 souvent \xE9voqu\xE9e."},{id:"bmo41",type:"qcm",q:`Parmi les "4 formes d'amour" \xE9voqu\xE9es, laquelle serait associ\xE9e \xE0 un besoin physiologique de l'autre ?`,options:["Eros","Philia","Parental","Contemplatif"],correct:0,explain:"Eros d\xE9signerait l'attirance physique et le besoin de l'autre."},{id:"bmo42",type:"qcm",q:"La s\xE9rotonine est souvent d\xE9crite comme le neurotransmetteur\u2026",options:["De l'ego et de la reconnaissance","De la douleur physique","Du sommeil profond","De la digestion"],correct:0,explain:"Elle serait li\xE9e \xE0 l'estime de soi et \xE0 la reconnaissance."},{id:"bmo43",type:"qcm",q:"Parmi les 3 formes de reconnaissance s\xE9rotoninergique cit\xE9es, laquelle correspond \xE0 des compliments verbalis\xE9s ?",options:["La reconnaissance officieuse d\xE9clarative","La reconnaissance officielle","La reconnaissance non d\xE9clarative","Aucune des trois"],correct:0,explain:"Un compliment exprim\xE9 \xE0 voix haute par une personne."},{id:"bmo44",type:"qcm",q:'Parmi les "formes de revendication" de la s\xE9rotonine, laquelle correspond au fait de raconter son histoire, ses id\xE9es ?',options:["La verbalisation","Le faire","La possession","Aucune de ces r\xE9ponses"],correct:0,explain:"Raconter, exprimer, mettre en mots ce qu'on vit."},{id:"bmo45",type:"vf",q:"Ce qu'une personne poss\xE8de et donne \xE0 voir pourrait aussi \xEAtre une forme de revendication de s\xE9rotonine.",correct:!0,explain:"Ce que l'on montre de soi participerait aussi \xE0 l'image qu'on projette."},{id:"bmo46",type:"qcm",q:'Comment pourrait-on r\xE9soudre une dissonance cognitive (\xE9cart entre "\xEAtre" et "faire") ?',options:["En modifiant soit l'un, soit l'autre","En ignorant le probl\xE8me","Cela ne se r\xE9soudrait jamais","En augmentant le cortisol"],correct:0,explain:"Rapprocher ses actes de son image, ou l'inverse."},{id:"bmo47",type:"qcm",q:`L'"effet Benjamin Franklin" \xE9voqu\xE9 d\xE9crit le fait que\u2026`,options:["Demander de l'aide \xE0 quelqu'un peut le rendre plus favorable envers nous","Rendre service rend toujours m\xE9fiant","Refuser d'aider renforce la sympathie","Il n'y aurait aucun effet mesurable"],correct:0,explain:"Rendre service cr\xE9erait un attachement positif envers la personne aid\xE9e."},{id:"bmo48",type:"vf",q:"Amener l'interlocuteur \xE0 se raconter permettrait de mieux comprendre ses objectifs et sa coh\xE9rence.",correct:!0,explain:"\xC9couter l'autre se raconter aiderait \xE0 comprendre sa logique interne."},{id:"bmo49",type:"qcm",q:`Que signifierait l'acronyme "DSO" \xE9voqu\xE9 pour \xE9tablir un lien avec quelqu'un ?`,options:["Dopamine, S\xE9rotonine, Ocytocine (dans cet ordre)","Discussion, Silence, Observation","D\xE9cision, Strat\xE9gie, Objectif","Aucun rapport avec les neurotransmetteurs"],correct:0,explain:"Un ordre de priorit\xE9 sugg\xE9r\xE9 pour cr\xE9er un lien rapidement."},{id:"bmo50",type:"qcm",q:`Parmi les "facteurs de reconnaissance" cit\xE9s, lequel concerne le fait d'offrir un moment privil\xE9gi\xE9 \xE0 quelqu'un ?`,options:["Le temps","L'identit\xE9","Les r\xE8gles de politesse","Les responsabilit\xE9s"],correct:0,explain:"Offrir du temps \xE0 quelqu'un serait une marque d'attention forte."},{id:"bmo51",type:"vf",q:"Offrir des responsabilit\xE9s \xE0 quelqu'un (un objectif et les moyens d'y r\xE9pondre) serait cit\xE9 comme un facteur de reconnaissance possible.",correct:!0,explain:"Confier une responsabilit\xE9 vaudrait reconnaissance et confiance."},{id:"bmo52",type:"qcm",q:"Dans le cadre d'un conflit, quelle question est souvent sugg\xE9r\xE9e comme prioritaire \xE0 se poser ?",options:["Qu'est-ce qui n'a pas \xE9t\xE9 reconnu ?","Qui a raison ?","Quel est le prix de la r\xE9conciliation ?","Faut-il punir ?"],correct:0,explain:"Chercher ce qui n'a pas \xE9t\xE9 reconnu apaiserait souvent la tension."},{id:"bmo53",type:"vf",q:"Se plaindre ou r\xE2ler ensemble peut cr\xE9er un lien social, mais activerait aussi la Noracort chez l'interlocuteur.",correct:!0,explain:"R\xE2ler ensemble rapprocherait, mais mettrait aussi l'autre sous tension."},{id:"bmo54",type:"qcm",q:"Selon l'axe de profilage \xE9voqu\xE9 dans certains mod\xE8les de neurosciences appliqu\xE9es, quel profil serait le plus rare ?",options:['Le profil "S pur"','Le profil "O pur"','Le profil "OS"','Le profil "SO"'],correct:0,explain:"Les profils extr\xEAmes, tr\xE8s affirm\xE9s, sera
